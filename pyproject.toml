[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whitehat"
version = "0.11.0a1"
description = "Security research toolkit for code analysis, scanner triage, and reproducible bounty reviews"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Carlosian"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
release = ["build==1.4.2", "setuptools==80.10.2"]
scanner-ruff = ["ruff==0.14.14"]
api = ["PyYAML==6.0.3"]
api-test = ["schemathesis==4.27.1", "hypothesis==6.168.0", "requests==2.34.2", "urllib3==2.7.0"]
test-tls = ["trustme==1.2.1"]

[project.urls]
Repository = "https://github.com/agentcarlosian/Whitehat"
Documentation = "https://github.com/agentcarlosian/Whitehat/blob/main/docs/quickstart.md"
Issues = "https://github.com/agentcarlosian/Whitehat/issues"
Changelog = "https://github.com/agentcarlosian/Whitehat/blob/main/CHANGELOG.md"

[project.scripts]
whitehat = "whitehat.cli:main"

[tool.setuptools.packages.find]
include = ["whitehat*"]
