[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whitehat"
version = "0.1.0"
description = "Security research toolkit for code analysis, scanner triage, and reproducible bounty reviews"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Carlosian"}]
keywords = ["security-research", "bug-bounty", "api-security", "static-analysis", "fuzzing"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
release = ["build==1.6.1", "setuptools==84.0.0"]
scanner-ruff = ["ruff==0.16.7"]
api = ["PyYAML==6.0.3"]
api-test = ["schemathesis==4.27.1", "hypothesis==6.168.0", "requests==2.34.2", "urllib3==2.7.0"]
test-tls = ["trustme==1.2.1"]
fuzz = ["hypothesis==6.168.0"]
graphql = ["graphql-core==3.2.12"]
source-fuzz = ["atheris==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.12' and python_version < '3.15'"]

[project.urls]
Repository = "https://github.com/agentcarlosian/Whitehat"
Documentation = "https://github.com/agentcarlosian/Whitehat/blob/main/docs/quickstart.md"
Issues = "https://github.com/agentcarlosian/Whitehat/issues"
Changelog = "https://github.com/agentcarlosian/Whitehat/blob/main/CHANGELOG.md"
Security = "https://github.com/agentcarlosian/Whitehat/security/policy"

[project.scripts]
whitehat = "whitehat.cli:main"

[tool.setuptools.packages.find]
include = ["whitehat*"]
