name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned scanner dependency
        run: python -m pip install ".[scanner-ruff,api,api-test,test-tls,fuzz,graphql]"

      - name: Install reviewed native research tools
        if: runner.os != 'macOS'
        run: python scripts/setup_tools.py --destination .whitehat/tools

      - name: Validate the repository
        run: python -B scripts/validate.py

      - name: Evaluate actual security research engines
        if: runner.os != 'macOS'
        run: python -B scripts/evaluate_research.py

      - name: Evaluate web and stateful API workflows
        if: runner.os != 'macOS'
        run: python -B scripts/evaluate_web.py

      - name: Evaluate capture, packet, binding, triage and coverage workflows
        run: python -B scripts/evaluate_bounty.py

      - name: Evaluate mutation, stateful, corpus and GraphQL workflows
        run: python -B scripts/evaluate_fuzz.py

      - name: Verify package installation
        run: |
          python -m pip install --no-deps .
          whitehat doctor --json
          whitehat run synthetic --message "installed CI fixture" --json
          whitehat scan ruff examples/scanner/problem --json
          whitehat import examples/reports/osv.json --format osv --json
          whitehat tools --json
          whitehat http preview examples/http/request.example.json --json
          whitehat api inventory examples/api/before.json --project owned-api --json
          whitehat session validate examples/network-session.synthetic.json --evaluation-time 2026-09-11T01:30:00Z --json
          python -B scripts/evaluate_bounty.py --installed
          python -B scripts/evaluate_fuzz.py --installed

  release-audit:
    needs: [validate, source-fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install release tools
        run: python -m pip install ".[release]"

      - name: Audit tracked release and distributions
        run: python -B -m whitehat release audit --json

  source-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned source fuzzer and generation extras
        run: python -m pip install ".[fuzz,graphql,source-fuzz]"
      - name: Verify actual Atheris and owned fuzz workflows
        run: python -B -m unittest discover -s tests -p test_fuzz_workflows.py -v
