name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned scanner dependency
        run: python -m pip install "ruff==0.14.14"

      - name: Validate the repository
        run: python -B scripts/validate.py

      - name: Verify package installation
        run: |
          python -m pip install --no-deps .
          whitehat doctor --json
          whitehat run synthetic --message "installed CI fixture" --json
          whitehat scan ruff examples/scanner/problem --json
          whitehat session validate examples/network-session.synthetic.json --evaluation-time 2026-09-11T01:30:00Z --json
